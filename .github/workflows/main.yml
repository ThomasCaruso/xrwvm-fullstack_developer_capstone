name: Capstone CI

on:
  push:
    branches: [main, capstone-complete]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python and Django checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Compile Python sources
        run: python -m compileall djangoapp djangoproj

      - name: Lint Python sources
        run: flake8 djangoapp djangoproj --exclude=djangoapp/migrations --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Django system checks
        run: python manage.py check

  javascript-quality:
    name: JavaScript and React checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Check Express source syntax
        working-directory: server/database
        run: |
          npm install
          npm run check

      - name: Install React dependencies
        working-directory: server/frontend
        run: npm install

      - name: Build React application
        working-directory: server/frontend
        env:
          CI: false
        run: npm run build
